name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      browser: ${{ steps.filter.outputs.browser }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'jobfeed/src/**'
              - 'jobfeed/tests/**'
              - 'jobfeed/scripts/**'
              - 'jobfeed/Makefile'
              - 'jobfeed/pyproject.toml'
              - 'jobfeed/uv.lock'
              - 'resume-application-pipeline/**'
              - '.github/workflows/ci.yml'
            browser:
              - 'jobfeed/web-ui/**'
              - 'jobfeed/src/jobfeed/web/**'
              - 'jobfeed/src/jobfeed/adapters/sources/*linkedin*'
              - 'jobfeed/tests/integration/test_linkedin_browser.py'
              - 'jobfeed/pyproject.toml'
              - 'jobfeed/uv.lock'
              - '.github/workflows/ci.yml'
            pipeline:
              - 'resume-application-pipeline/**'
              - 'jobfeed/src/**'
              - 'jobfeed/pyproject.toml'
              - '.github/workflows/ci.yml'

  setup-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README and website setup prompts match docs/setup-prompt.txt
        run: python3 scripts/sync_setup_prompt.py --check

  quality-gate:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobfeed
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip's wheel/HTTP download dir so the heavy ML deps
          # (xgboost / numpy / fastembed+onnxruntime / playwright) aren't
          # re-downloaded every run; keyed on pyproject.toml.
          cache: pip
          cache-dependency-path: |
            jobfeed/pyproject.toml
            resume-application-pipeline/requirements*.txt

      # Jobfeed's application tests drive the sibling pipeline, so both
      # projects share one environment, as in a local checkout.
      - name: Install dependencies
        run: >-
          pip install -e ".[dev]"
          -r ../resume-application-pipeline/requirements.txt
          -r ../resume-application-pipeline/requirements-jobfeed-mcp.txt

      # Python repost regression tests execute the extension's real DOM parser.
      - name: Set up Node.js for extension and frontend verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend test dependencies
        run: |
          npm install --global pnpm@10.33.0
          pnpm --dir web-ui install --frozen-lockfile

      - name: Run quality gate (lint + unit/contract tests, no PG)
        run: make quality

      - name: Verify extension and frontend
        run: |
          node --test tests/extension/*.test.cjs
          pnpm --dir web-ui lint
          pnpm --dir web-ui test
          pnpm --dir web-ui build

  browser-tests:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobfeed
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobfeed/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run browser tests
        run: pytest -m browser -o "addopts=" -v --tb=short

  pipeline-tests:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-application-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobfeed/pyproject.toml
            resume-application-pipeline/requirements*.txt

      - name: Install dependencies
        run: >-
          pip install -e "../jobfeed[dev]"
          -r requirements.txt
          -r requirements-jobfeed-mcp.txt

      - name: Create the synthetic template fixture
        run: python tools/create_example_template.py

      - name: Run pipeline tests
        run: PYTHONPATH=.:tests python -m pytest tests -q
