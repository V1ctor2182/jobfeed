<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jobfeed Jobright Source</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Jobright Source</h1>
      <p id="status" class="status">Checking connection…</p>
      <label for="base-url">Jobfeed URL</label>
      <input id="base-url" type="url" spellcheck="false" />
      <button id="save" type="button">Save and reconnect</button>
      <p class="hint">Keep Jobfeed running. Scans reuse your Chrome Jobright login without reading cookies.</p>
      <section aria-labelledby="application-heading">
        <h2 id="application-heading">Application tab connection</h2>
        <p class="hint">On the existing application tab, enter the code from its job in Runs. Connecting preserves this page.</p>
        <label for="application-dashboard">Dashboard URL</label>
        <input id="application-dashboard" type="url" value="https://jobfeed.localhost:1355" spellcheck="false" />
        <label for="application-code">Pairing code</label>
        <input id="application-code" type="text" autocomplete="off" spellcheck="false" />
        <button id="application-connect" type="button">Connect this tab</button>
        <p id="application-status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <p><a href="pilot.html" target="_blank">LinkedIn / Handshake batch test</a></p>
    <script src="popup.js"></script>
  </body>
</html>
