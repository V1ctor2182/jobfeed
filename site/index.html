<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobfeed — your job search, running in the background</title>
<meta name="description" content="Jobfeed is an open-source, local-first job search workspace. It finds jobs, scores them against your résumé, and applies with Claude Appliers while you get on with your life.">
<meta property="og:title" content="Jobfeed">
<meta property="og:description" content="Live your life. Your job search keeps running.">
<meta property="og:image" content="https://v1ctor2182.github.io/jobfeed/assets/dashboard.webp">
<meta property="og:url" content="https://v1ctor2182.github.io/jobfeed/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4f3f0;          /* dashboard --jf-bg */
  --ink: #171614;
  --ink-2: #4f4c47;
  --ink-3: #8d8982;
  --accent: #e8742a;         /* dashboard --jf-accent */
  --cream: #f7f1e3;
  --serif: "EB Garamond", Georgia, serif;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121110; --ink: #ecebe7; --ink-2: #c2beb7; --ink-3: #8d8982; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121110; --ink: #ecebe7; --ink-2: #c2beb7; --ink-3: #8d8982; color-scheme: dark; }

* { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--accent); color: #fff; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

.top .wrap { display: flex; align-items: center; gap: 20px; height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
.mark { width: 24px; height: 24px; display: block; image-rendering: pixelated; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark { box-shadow: 0 0 0 1px #3a3835; } }
.gh { font-size: 13px; text-decoration: none; color: var(--ink-2); margin-left: auto; }
.gh:hover { color: var(--ink); }

/* the painting: a funnel of green between dark hills */
.hero { padding: clamp(32px, 9vh, 112px) 0 0; }
.canvas-wrap { position: relative; height: clamp(560px, 80vh, 880px); overflow: hidden; background: #1f7a33; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#flow { z-index: 1; }
.say { position: absolute; left: 0; right: 0; top: 30%; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; color: var(--cream); }
h1 {
  margin: 0; font: 400 clamp(38px, 5.6vw, 76px)/1.06 var(--serif); letter-spacing: -.012em; text-wrap: balance;
  text-shadow: 0 1px 18px rgba(8, 28, 10, .4);
}
.acts { display: flex; gap: 22px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: clamp(28px, 4.5vh, 44px); }
.copy {
  font: 500 15px/1 var(--sans); letter-spacing: -.005em; color: #143d1c; border: 0; border-radius: 999px;
  padding: 15px 26px; cursor: pointer; min-height: 48px;
  background: linear-gradient(120deg, #fffaf0 0%, #f9e3c6 45%, #f4b88a 100%) 0 0 / 160% 100%;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 6px 18px rgba(8, 30, 10, .22);
  transition: background-position .45s ease, transform .15s;
}
.copy:hover { background-position: 100% 0; transform: translateY(-1px); }
.star {
  display: inline-flex; align-items: stretch; min-height: 48px; border-radius: 999px; overflow: hidden; text-decoration: none;
  font: 500 15px/1 var(--sans); color: var(--cream); border: 1px solid rgba(247, 241, 227, .6);
  background: rgba(10, 40, 16, .28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background .2s;
}
.star:hover { background: rgba(10, 40, 16, .45); }
.star span { display: inline-flex; align-items: center; gap: 9px; padding: 0 18px; }
.star svg { width: 18px; height: 18px; fill: currentColor; }
.star .n { border-left: 1px solid rgba(247, 241, 227, .45); padding: 0 16px; font-variant-numeric: tabular-nums; }
.star .n svg { width: 14px; height: 14px; }
.star [hidden] { display: none; }

footer { padding: clamp(72px, 16vh, 180px) 0 40px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; font-size: 13px; color: var(--ink-3); }
footer nav { display: flex; flex-wrap: wrap; gap: 8px 22px; }
footer a { text-decoration: none; } footer a:hover { color: var(--ink); }

@media (max-width: 720px) {
  .wrap { width: calc(100% - 24px); }
  .canvas-wrap { height: 80svh; min-height: 540px; }
  .say { top: 22%; }
  .acts { flex-direction: column; gap: 18px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Jobfeed home"><img class="mark" src="assets/favicon.svg" width="24" height="24" alt="">Jobfeed</a>
    <a class="gh" href="https://github.com/V1ctor2182/jobfeed">GitHub ↗</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="canvas-wrap" id="art">
        <canvas id="paint" aria-hidden="true"></canvas>
        <canvas id="flow" aria-hidden="true"></canvas>
        <div class="say">
          <h1>Live your life.<br>Your job search keeps running.</h1>
          <div class="acts">
            <button class="copy" type="button"
              data-copy="Set up Jobfeed on my server as a background service.&#10;Read https://raw.githubusercontent.com/V1ctor2182/jobfeed/main/docs/server-install.md and follow it exactly, including how it says to talk to me: short, structured messages and numbered choices.&#10;If you aren't running on my server, ask me how to reach it. Ask me before using sudo, don't start any scan, and test everything before you hand over."
              data-done="Copied · paste into Claude Code"
              title="Copies a setup prompt for Claude Code or Codex">Copy setup prompt</button>
            <a class="star" href="https://github.com/V1ctor2182/jobfeed" aria-label="Star Jobfeed on GitHub"><span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Star on GitHub</span><span class="n" id="stars" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg><b></b></span></a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Jobfeed · MIT · originally created by <a href="https://github.com/wenqiw777/jobfeed">wenqiw777</a>, published with permission</span>
    <nav>
      <a href="https://github.com/V1ctor2182/jobfeed/blob/main/LICENSE">MIT License</a>
      <a href="https://github.com/V1ctor2182/jobfeed">GitHub</a>
    </nav>
  </div>
</footer>

<script>
(function () {
  /* ---------- GitHub stars ---------- */
  fetch("https://api.github.com/repos/V1ctor2182/jobfeed", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || typeof d.stargazers_count !== "number" || d.stargazers_count < 1) return;
      var n = d.stargazers_count, el = document.getElementById("stars");
      el.querySelector("b").textContent = n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
      el.hidden = false;
    }).catch(function () {});

  /* ---------- copy ---------- */
  document.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.dataset.busy) return;
      var label = btn.innerHTML, text = btn.dataset.copy;
      function done() {
        btn.dataset.busy = "1";
        btn.textContent = btn.dataset.done;
        setTimeout(function () { btn.innerHTML = label; delete btn.dataset.busy; }, 2200);
      }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "absolute"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.select();
        var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        if (ok) done();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });
  });

  /* ---------- noise ---------- */
  function hash(x, y, s) {
    var h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function noise(x, y, s) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s) { return noise(x, y, s) * 0.55 + noise(x * 2.1, y * 2.1, s + 7) * 0.3 + noise(x * 4.3, y * 4.3, s + 13) * 0.15; }
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  var P = {
    sky: rgb("#f2a674"), sky2: rgb("#e8742a"), blue: rgb("#8fc3e6"),
    deep: rgb("#0f5a26"), mid: rgb("#1d7531"), olive: rgb("#4f8a22"),
    lime: rgb("#86b22c"), yg: rgb("#a2c23a"), cream: rgb("#f6ead6"), pink: rgb("#eeb6ac")
  };

  /* the funnel's half width, as a share of the width, at a height Y (0 top, 1 bottom) */
  var MOUTH = 0.24, SPOUT = 0.97;
  function halfWidth(Y, m) {
    var t = Math.min(1, Math.max(0, (Y - (m ? 0.4 : 0.34)) / (SPOUT - (m ? 0.4 : 0.34)))), sm = t * t * (3 - 2 * t);
    return 0.028 + (m ? 0.47 : 0.45) * Math.pow(1 - sm, 1.35);
  }

  /* ---------- the painting ---------- */
  var art = document.getElementById("art"), cvs = document.getElementById("paint"), ctx = cvs.getContext("2d"), lastW = 0;
  function paint() {
    var r = cvs.getBoundingClientRect();
    if (!r.width || Math.abs(r.width - lastW) < 2 && cvs.width) return;
    lastW = r.width;
    var w = Math.round(r.width), h = Math.round(r.height), m = w < 720;
    cvs.width = w; cvs.height = h;
    var img = ctx.createImageData(w, h), d = img.data, S = w, ax = w * 0.5, ay = h * 1.02;
    for (var y = 0; y < h; y++) {
      var Y = y / h, hw = halfWidth(Y, m);
      for (var x = 0; x < w; x++) {
        var u = x / S, v = y / S;
        var su = u * 0.97 + v * 0.24, sv = v * 0.97 - u * 0.24;
        var warp = fbm(u * 3.2, v * 3.2, 1) - 0.5;
        var streak = fbm(su * 2.4, sv * 46, 2), fine = fbm(su * 10, sv * 170, 3), grit = noise(su * 60, sv * 420, 5);
        var g = hash(x, y, 9), cluster = noise(u * 26, v * 26, 6) > 0.62;
        var skyT = Y - (x / w) * 0.1 + warp * 0.12 + (streak - 0.5) * 0.06 + (grit - 0.5) * 0.03;
        /* polar strokes inside the funnel all run toward the spout */
        var rx = (x - ax) / S, ry = (y - ay) / S, rr = Math.sqrt(rx * rx + ry * ry), th = Math.atan2(ry, rx);
        var rad = fbm(rr * 6, th * 50, 11), radFine = noise(rr * 34, th * 240, 12);
        var edge = Math.abs(x / w - 0.5) - hw + (rad - 0.5) * 0.07 + (grit - 0.5) * 0.025 + warp * 0.05;
        var rim = Y - MOUTH + (streak - 0.5) * 0.1 + warp * 0.14 + (grit - 0.5) * 0.02;
        var c;
        if (skyT < 0.08) {
          c = streak > 0.6 ? P.sky2 : P.sky;
          if (x / w > 0.76 && skyT < 0.02 && fine > 0.55) c = P.blue;
        } else if (edge < 0 && rim > 0) {
          c = rad > 0.57 ? P.yg : P.lime;
          if (radFine < 0.16 || grit < 0.06) c = P.olive;
          if (radFine > 0.9 && g < 0.25) c = P.cream;
        } else {
          c = fine > 0.56 ? P.mid : P.deep;
          if (fine > 0.79 || grit > 0.87) c = P.olive;
          if (grit > 0.94) c = P.lime;
          if (g < (cluster ? 0.035 : 0.005)) c = g < 0.01 ? P.cream : P.pink;
        }
        var k = 0.93 + 0.14 * hash(x, y, 4), i = (y * w + x) * 4;
        d[i] = Math.min(255, c[0] * k); d[i + 1] = Math.min(255, c[1] * k); d[i + 2] = Math.min(255, c[2] * k); d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  /* ---------- jobs flowing down the funnel ---------- */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fl = document.getElementById("flow"), fx = fl.getContext("2d"), F = null, parts = [], flashes = [], keep = [];
  function keepOut() {
    var a = art.getBoundingClientRect();
    keep = [document.querySelector("h1"), document.querySelector(".acts")].map(function (el) {
      var r = el.getBoundingClientRect(); return { x: r.left - a.left - 10, y: r.top - a.top - 8, w: r.width + 20, h: r.height + 16 };
    });
  }
  function hidden(x, y) { for (var i = 0; i < keep.length; i++) { var k = keep[i]; if (x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h) return true; } return false; }
  function setupFlow() {
    var r = fl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    fl.width = Math.round(r.width * dpr); fl.height = Math.round(r.height * dpr);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
    F = { W: r.width, H: r.height, m: r.width < 720, ax: r.width * 0.5, ay: r.height * 1.02 };
    keepOut();
    parts = [];
    var n = F.m ? 70 : 150;
    for (var i = 0; i < n; i++) parts.push(spawn(Math.random()));
  }
  function spawn(progress) {
    var hot = Math.random() < 0.16, Y = MOUTH + 0.03 + Math.random() * 0.22, hw = halfWidth(Y, F.m);
    var spread = hot ? 0.3 : 0.95, X = 0.5 + (Math.random() * 2 - 1) * hw * spread;
    var p = { x: X * F.W, y: Y * F.H, hot: hot, len: 8 + Math.random() * 18, v: 22 + Math.random() * 26, a: 0, out: false,
      tone: Math.random() < 0.55 ? "#cfe07a" : "#f6ead6" };
    if (progress) { /* start somewhere along its way, so the first frame is already full */
      var dx = F.ax - p.x, dy = F.ay - p.y; p.x += dx * progress * 0.7; p.y += dy * progress * 0.7; p.a = 1;
    }
    return p;
  }
  function step(dt) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], dx = F.ax - p.x, dy = F.ay - p.y, dist = Math.sqrt(dx * dx + dy * dy);
      var near = 1 + 2.2 * Math.max(0, 1 - dist / (F.H * 0.6));
      p.x += dx / dist * p.v * near * dt; p.y += dy / dist * p.v * near * dt;
      var hw = halfWidth(p.y / F.H, F.m) * F.W;
      if (!p.out && Math.abs(p.x - F.ax) > hw - 4 && !p.hot) p.out = true;
      p.a = p.out ? p.a - dt * 1.6 : Math.min(1, p.a + dt * 1.5);
      if (p.y > F.H - 8) { if (p.hot) flashes.push({ t: 0 }); parts[i] = spawn(0); continue; }
      if (p.a <= 0 && p.out) parts[i] = spawn(0);
    }
  }
  function drawFlow(dt) {
    var W = F.W, H = F.H;
    fx.clearRect(0, 0, W, H);
    fx.lineCap = "round";
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.a <= 0 || hidden(p.x, p.y)) continue;
      var dx = F.ax - p.x, dy = F.ay - p.y, dist = Math.sqrt(dx * dx + dy * dy), ux = dx / dist, uy = dy / dist;
      fx.globalAlpha = p.a * (p.hot ? 0.95 : 0.6);
      fx.strokeStyle = p.hot ? "#f08a45" : p.tone;
      fx.lineWidth = p.hot ? 2.8 : 2;
      fx.beginPath(); fx.moveTo(p.x - ux * p.len, p.y - uy * p.len); fx.lineTo(p.x, p.y); fx.stroke();
    }
    /* each orange one that reaches the spout is an application going out */
    flashes = flashes.filter(function (f) {
      f.t += dt; var k = f.t / 0.9; if (k > 1) return false;
      fx.globalAlpha = 1 - k; fx.strokeStyle = "#f6ead6"; fx.lineWidth = 2;
      for (var j = 0; j < 7; j++) {
        var a = -Math.PI / 2 + (j - 3) * 0.32, r0 = 6 + k * 18, r1 = r0 + 8 + k * 10;
        fx.beginPath(); fx.moveTo(F.ax + Math.cos(a) * r0, H - 4 + Math.sin(a) * r0); fx.lineTo(F.ax + Math.cos(a) * r1, H - 4 + Math.sin(a) * r1); fx.stroke();
      }
      fx.fillStyle = "#f08a45"; fx.fillRect(F.ax - 5, H - 9, 10, 10);
      return true;
    });
    fx.globalAlpha = 1;
  }
  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
    if (!document.hidden) { step(dt); drawFlow(dt); }
    requestAnimationFrame(frame);
  }

  paint(); setupFlow();
  if (reduce) drawFlow(0); else requestAnimationFrame(frame);
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { paint(); setupFlow(); if (reduce) drawFlow(0); }, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(keepOut);
})();
</script>
</body>
</html>
